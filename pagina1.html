<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Página 1</title>
</head>
<body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            color: #333;
        }

        #palabra {
            font-size: 35px;
            letter-spacing: 10px;
            margin: 20px;
        }

        button {
            padding: 10px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        #mensaje {
            font-size: 22px;
            color: red;
        }

        #ahorcado {
            font-size: 60px;
        }
    </style>
</head>

<body>

<h1>🎮 Juego del Ahorcado</h1>

<div id="ahorcado">🙂</div>

<div id="palabra"></div>

<p>Intentos: <span id="intentos">6</span></p>

<div id="letras"></div>

<p id="mensaje"></p>


<script>

let palabras = [
    "computadora",
    "javascript",
    "html",
    "internet",
    "programacion"
];

let palabra = palabras[Math.floor(Math.random()*palabras.length)];

let oculta = [];

let errores = 0;


for(let i=0;i<palabra.length;i++){
    oculta.push("_");
}


document.getElementById("palabra").innerHTML = oculta.join(" ");



let letras = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";


letras.split("").forEach(letra=>{

    let boton = document.createElement("button");

    boton.innerHTML = letra;

    boton.onclick = function(){

        boton.disabled = true;

        let acertado = false;


        for(let i=0;i<palabra.length;i++){

            if(palabra[i].toUpperCase()==letra){

                oculta[i]=palabra[i];

                acertado=true;
            }
        }


        if(!acertado){

            errores++;

            document.getElementById("intentos").innerHTML = 6-errores;
        }


        document.getElementById("palabra").innerHTML = oculta.join(" ");


        if(!oculta.includes("_")){

            document.getElementById("mensaje").innerHTML =
            "🎉 Ganaste!";

        }


        if(errores>=6){

            document.getElementById("mensaje").innerHTML =
            "❌ Perdiste. Era: "+palabra;

            document.querySelectorAll("button")
            .forEach(b=>b.disabled=true);
        }

    };


    document.getElementById("letras").appendChild(boton);

});


</script>

</body>
</html>
